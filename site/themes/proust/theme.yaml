name: Proust
description: >-
  The accent-proust project site. Accent's palette, dark first, built around a
  live WebAssembly playground.
version: "1.0.0"
author: AccentX GmbH
license: MIT
# The theme ships no shortcodes. Every `{% callout %}` on the site is an example
# inside a code block -- the pages document Markdoc, they do not use Accent's
# components -- so `accent validate` is told there is nothing to implement
# rather than given nine templates nothing renders.
components: none
assets:
  css:
    - css/main.scss
  # The playground script is not listed here. Theme assets in this list load on
  # every page, and this one is an ES module that instantiates a 200 KB
  # WebAssembly engine -- the playground template pulls it in itself, so the
  # other pages never pay for it.
  js: []
styling:
  sass:
    enabled: true
    load_paths:
      - css
