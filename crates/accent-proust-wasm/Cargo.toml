[package]
name = "accent-proust-wasm"
version = "0.9.0"
edition = "2024"
license = "MIT"
description = "WebAssembly bindings for accent-proust: validate, transform, render and format Markdoc in a browser."
repository = "https://github.com/zoosky/accent-proust"
# The artifact is an npm package, not a crate. Publishing the binding to
# crates.io would offer a `cdylib` nobody can link against from Rust, and would
# put a second version number on the same release.
publish = false

[lib]
# `cdylib` is the artifact wasm-bindgen post-processes. `rlib` is kept so that
# `cargo doc` and a host-target `cargo check` still have something to build.
crate-type = ["cdylib", "rlib"]

[dependencies]
accent-proust = { path = "../..", version = "0.9.0" }
# The attribute and object maps this crate walks are the library's, so the
# version has to be the library's.
indexmap = "2"
js-sys = "0.3"
wasm-bindgen = "0.2"

[dev-dependencies]
wasm-bindgen-test = "0.3"

# Repeated rather than inherited from the workspace. `unsafe_code = "forbid"`
# cannot be relaxed by a member that needs it, so a shared block would be a
# decision taken on behalf of every future host; and the library's manifest is
# the one that gets published, which is a reason to leave it alone. The floor is
# the same because the promise is: this crate hands arbitrary documents to a
# parser and a trap in wasm poisons the instance rather than unwinding.
[lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
panic = "warn"
unwrap_used = "warn"
expect_used = "warn"
indexing_slicing = "warn"
