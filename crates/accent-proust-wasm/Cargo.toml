[package]
name = "accent-proust-wasm"
version = "0.10.0"
edition = "2024"
license = "MIT"
description = "WebAssembly bindings for accent-proust: validate, transform, render and format Markdoc in a browser."
repository = "https://github.com/zoosky/accent-proust"
# The artifact is an npm package, not a crate. Publishing the binding to
# crates.io would offer a `cdylib` nobody can link against from Rust, and would
# put a second version number on the same release.
publish = false

[lib]
# `cdylib` is the artifact wasm-bindgen post-processes. `rlib` is kept so that
# `cargo doc` and a host-target `cargo check` still have something to build.
crate-type = ["cdylib", "rlib"]

[dependencies]
accent-proust = { path = "../..", version = "0.10.0" }
# The attribute and object maps this crate walks are the library's, so the
# version has to be the library's.
indexmap = "2"
js-sys = "0.3"
wasm-bindgen = "0.2"

[dev-dependencies]
wasm-bindgen-test = "0.3"

# The workspace's block, opted into. This used to be a copy, on the reasoning
# that a shared block would bind every future host; it does not, because
# inheritance is opt-in per member, and a copy only meant three places for the
# same eleven lines to drift. The floor is the right one here because the
# promise is the same: this crate hands arbitrary documents to a parser, and a
# trap in wasm poisons the instance rather than unwinding.
[lints]
workspace = true
