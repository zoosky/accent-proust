[package]
name = "accent-proust"
version = "0.0.0"
edition = "2021"
rust-version = "1.82"
license = "MIT"
description = "A Rust implementation of the Markdoc language: parse, validate, transform, render, and format."
readme = "README.md"
repository = "https://github.com/zoosky/accent-proust"
keywords = ["markdoc", "markdown", "commonmark", "parser", "formatter"]
categories = ["parser-implementations", "text-processing"]
# `reference/` is upstream's TypeScript, vendored unmodified so that a porting
# pull request shows its source and the yearly upstream refresh is a diff. It is
# 392 KB of another language: useful in the repository, dead weight in a
# `.crate`. `spec/` is not excluded -- the corpus is the test suite, and a
# package that cannot run its own tests is a worse trade than 60 KB.
exclude = ["reference/"]

[features]
default = ["pulldown-cmark-tokenizer"]
# The bundled `Tokenizer` implementation over pulldown-cmark. Turning it off
# leaves the trait and every layer above it, so a host that already owns a
# CommonMark parser can supply its own segmentation without compiling a second
# one. That is the whole point of the seam.
pulldown-cmark-tokenizer = ["dep:pulldown-cmark"]

[dependencies]
# Attribute order is authored order, never hash order: rendered output must be
# byte-reproducible across runs.
indexmap = "2"
thiserror = "2"
# Optional so the CommonMark engine stays a detail of one feature.
pulldown-cmark = { version = "0.13", optional = true, default-features = false }

[dev-dependencies]
proptest = "1"
# Reads the vendored conformance corpus. Pure Rust, no serde, and confined to
# one module of the harness (`tests/conformance/corpus.rs`) so that replacing it
# is a change to one file. Default features off: `encoding` pulls in encoding_rs
# to sniff non-UTF-8 documents, and the corpus is UTF-8.
#
# Note for anyone running the tests on an old toolchain: this dependency needs a
# newer rustc than the crate's own MSRV. That is a floor for `cargo test` in this
# repository only -- dev-dependencies are never built by a consumer, so the
# `rust-version` above remains the promise it says it is.
saphyr = { version = "0.0.12", default-features = false }

[lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Panic-freedom is a published promise, not a review habit: this is an open
# parser fed arbitrary text, so its attack surface is part of its API. These
# four are the static form of that promise. Where a bound is genuinely proven,
# `#[allow]` it with a comment saying why -- an allow with a reason is the
# intended escape hatch, an allow without one is the thing being prevented.
panic = "warn"
unwrap_used = "warn"
expect_used = "warn"
indexing_slicing = "warn"

# The suites that exercise the bundled tokenizer, named so that
# `cargo test --no-default-features` skips them instead of failing to compile.
# That lane is Invariant 1 -- the crate builds and tests with nothing else
# present -- and it stays meaningful because `tokenizer_seam` is *not* listed
# here: it implements `Tokenizer` by hand and runs in both lanes, which is the
# configuration a host supplying its own CommonMark parser uses.
[[test]]
name = "conformance"
required-features = ["pulldown-cmark-tokenizer"]

[[test]]
name = "parser"
required-features = ["pulldown-cmark-tokenizer"]

[[test]]
name = "annotations"
required-features = ["pulldown-cmark-tokenizer"]

[[test]]
name = "comments"
required-features = ["pulldown-cmark-tokenizer"]

[[test]]
name = "links"
required-features = ["pulldown-cmark-tokenizer"]

[[test]]
name = "node"
required-features = ["pulldown-cmark-tokenizer"]

[[test]]
name = "parse_proptests"
required-features = ["pulldown-cmark-tokenizer"]

[[test]]
name = "validator"
required-features = ["pulldown-cmark-tokenizer"]

[[test]]
name = "table_transform"
required-features = ["pulldown-cmark-tokenizer"]

[[test]]
name = "utils"
required-features = ["pulldown-cmark-tokenizer"]

[[test]]
name = "formatter"
required-features = ["pulldown-cmark-tokenizer"]

# Parses its own fixtures, so it is gated like the suites above and skipped by
# `--no-default-features` rather than failing to compile in that lane.
[[example]]
name = "partial_scope_cost"
required-features = ["pulldown-cmark-tokenizer"]

# The README's Rust blocks, run by CI. Gated for the same reason: every block
# parses a document. `tests/readme.rs` holds the two copies together, and needs
# no features because it only compares text.
[[example]]
name = "readme"
required-features = ["pulldown-cmark-tokenizer"]
